name: Build and Test

# Two entry points with different matrices, because they answer different
# questions.
#
# A pull request gets Windows and Linux x64, always. Until 2026-09-11
# this workflow was dispatch-only and nothing built a PR at all — the only
# check on one was the Peanut Gallery reviewer, whose pass means "the panel
# ran", not "it compiles". #110 merged on that alone.
#
# Both legs run on the maintainer's self-hosted runners, the same ones
# publish.yml uses: WINDOWS_RUNNER and LINUX_RUNNER, with the same defaults.
# A pull request from a fork gets GitHub's hosted windows-latest and
# ubuntu-latest instead. Its tree would otherwise build and run on the
# maintainer's machines, and peanut-gallery.yml keeps forks off them for the
# same reason. This is hygiene, not a boundary: a fork's pull_request runs the
# fork's copy of this file. The boundary is the repository setting that holds
# every outside contributor's run for approval.
#
# linux-arm64 is not built here. GitHub's hosted Arm runner is the only Arm
# machine available, and publish.yml tests on it before every release.
#
# Those legs build Release. A pull request, and a dispatch that ticks linux,
# also gets a Debug leg, because some checks exist only in a Debug build and
# Release compiles them away with their tests (#726); see the "Test (Debug)"
# step. It always runs on GitHub's hosted ubuntu-latest, so it takes no
# self-hosted Linux runner from the Release leg and the reviewer.
#
# A dispatch still picks any subset of Windows, Linux and macOS, and macOS is
# reachable only that way. The reason is now purely price: it is the
# 10x-billed runner.
#
# It used to be more than price. Until 2026-09 the macOS leg took its FFmpeg
# from a Homebrew keg rather than a pinned build, so a green macOS run answered
# a weaker question than the other two. That is no longer true: osx-arm64
# downloads the same pinned, hashed artifact every other RID does, and
# FrameFlow.Native.Runtime ships a RID for it. A macOS dispatch now tests the
# bytes the package ships. Worth running before anything that touches the
# native layer, rather than only when something looks wrong.
#
# Restore runs unauthenticated, so a fork pull request builds like any other and
# nothing here reads a secret. This workflow used to add the private GitHub
# Packages feed with PACKAGES_READ_PAT because FrameFlow.Native.Runtime lived
# only there; #51 mapped that id to nuget.org on 2026-08-31 and it has published
# 0.7.0-alpha.4 and 0.8.0-alpha.1 since. All 35 PackageReference ids in the
# solution now resolve from nuget.org. The credential outlived its reason by two
# months unnoticed, because the last dispatch before this trigger existed was
# 2026-06-24 — the step was never run again to be found redundant.
#
# If a private package is ever reintroduced, this stops being true: the auth step
# comes back, and with it the fork problem, because GitHub hands no secrets to a
# fork's pull_request.
#
# No paths-ignore. A docs-only PR will burn a build, which is the cheaper
# mistake: paths-ignore leaves the check permanently pending rather than
# skipped, so it cannot be made a required check later without stranding every
# docs PR.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      windows:
        description: 'Run on Windows (WINDOWS_RUNNER, self-hosted by default)'
        type: boolean
        default: true
      linux:
        description: 'Run on Linux x64 (LINUX_RUNNER, self-hosted by default), and the Debug leg on ubuntu-latest'
        type: boolean
        default: true
      macos:
        description: 'Run on macos-latest'
        type: boolean
        default: true

# Supersede a PR's in-flight run when the branch is pushed again; never cancel a
# dispatch, which someone asked for deliberately.
#
# This diverges from peanut-gallery.yml, which sets cancel-in-progress: false
# because a CANCELLED conclusion turned its check rollup UNSTABLE. That reason
# does not transfer. The reviewer's runs are single-writer comment updates worth
# serializing; a build superseded four seconds later is pure runner-minutes, and
# runner-minutes are the whole reason this trigger did not exist before.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege, matching peanut-gallery.yml and publish.yml — build.yml was the
# only workflow here without a permissions block, so GITHUB_TOKEN was taking the
# repository default. That matters more now than under dispatch-only: a pull
# request's own MSBuild targets and tests execute in this workspace, and
# actions/checkout writes the token into .git/config as an extraheader unless told
# not to. This job holds no other credential and pushes nothing, so contents: read
# is the ceiling.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # Build the matrix: one leg per OS, each naming its runner. On a pull request
  # the legs are fixed; on a dispatch they come from the inputs, and the job
  # fails fast if no OS was selected — the job log shows the error so the user
  # knows why.
  #
  # A leg is self-hosted when its runner labels say so. A self-hosted Linux leg
  # runs in the .NET SDK container, because that host has only Docker; the steps
  # below read `hosted` and `container` to decide what each machine needs, and
  # `configuration` to tell the Debug leg from the Release legs.
  #
  # This job stays on ubuntu-latest. It runs for seconds, and on a self-hosted
  # runner it would queue behind the builds it is there to start.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.os.outputs.matrix }}
    steps:
      - id: os
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          WINDOWS_RUNNER: ${{ vars.WINDOWS_RUNNER || '["self-hosted","windows","x64"]' }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER || '["self-hosted","linux","x64","docker"]' }}
          WANT_WINDOWS: ${{ inputs.windows }}
          WANT_LINUX: ${{ inputs.linux }}
          WANT_MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail

          # leg <os> <runner labels> [configuration, Release unless given]
          leg() {
            jq -cn --arg os "$1" --argjson runner "$2" --arg configuration "${3:-Release}" '
              ($runner | index("self-hosted") != null) as $self
              | { os: $os,
                  runner: $runner,
                  configuration: $configuration,
                  hosted: ($self | not),
                  container: (if $self and $os == "linux"
                              then "mcr.microsoft.com/dotnet/sdk:10.0" else "" end) }'
          }

          LEGS=()
          if [ "$EVENT" != "workflow_dispatch" ]; then
            # Not a dispatch: the inputs do not exist, and reading them would make
            # every OS false and trip the "no OS selected" error below.
            if [ "$FORK" = "true" ]; then
              LEGS+=("$(leg windows '["windows-latest"]')" "$(leg linux '["ubuntu-latest"]')")
            else
              LEGS+=("$(leg windows "$WINDOWS_RUNNER")" "$(leg linux "$LINUX_RUNNER")")
            fi
            LEGS+=("$(leg linux '["ubuntu-latest"]' Debug)")
          else
            [ "$WANT_WINDOWS" = "true" ] && LEGS+=("$(leg windows "$WINDOWS_RUNNER")")
            [ "$WANT_LINUX" = "true" ] && LEGS+=("$(leg linux "$LINUX_RUNNER")" "$(leg linux '["ubuntu-latest"]' Debug)")
            [ "$WANT_MACOS" = "true" ] && LEGS+=("$(leg macos '["macos-latest"]')")
          fi

          if [ ${#LEGS[@]} -eq 0 ]; then
            echo "::error::No OS selected — tick at least one of windows / linux / macos."
            exit 1
          fi
          matrix="$(printf '%s\n' "${LEGS[@]}" | jq -cs '{include: .}')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: setup
    # The Release legs keep the names they had before the Debug leg existed.
    name: test (${{ matrix.os }}${{ matrix.configuration == 'Debug' && ', Debug' || '' }})
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Backstop for a self-hosted runner, which a wedged job would otherwise hold
    # for GitHub's six-hour cap. A clean run takes well under half of this.
    timeout-minutes: 60
    # The self-hosted Linux host has only Docker, so that leg brings its SDK in a
    # container, as publish.yml's publish job does. Empty string = no container.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # MinVer needs full history to derive version from tags.
          # Do not leave the token in .git/config as an extraheader. MinVer reads
          # history and tags, which is local work needing no credential, and
          # nothing in this job pushes. Without this, the PR's own build and test
          # code shares a workspace with a usable token.
          persist-credentials: false

      # Several runner instances can share one self-hosted Windows machine.
      # scripts/fetch-ffmpeg.cs downloads into a fixed directory under TEMP,
      # scripts/package-smoke.cs works in one, and an OpenVINO test clears its earlier
      # runs' directories, so two jobs with the same TEMP collide. RUNNER_TEMP belongs
      # to the instance and is emptied at every job, so this keeps each job's temp files
      # to itself whatever TEMP the runner host sets. It cannot help a runner that runs
      # jobs as SYSTEM: for SYSTEM, .NET's Path.GetTempPath() returns
      # C:\Windows\SystemTemp and ignores TEMP and TMP. A hosted runner has one
      # instance, and the step does no harm there.
      - name: Use the runner's own temp directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Container only, for the reason publish.yml gives: the job runs as root over
      # runner-owned files, git calls the checkout "dubious ownership", and MinVer's
      # own git call falls back to 0.0.0-alpha.0.
      - name: Trust workspace for git (container)
        if: matrix.container != ''
        run: git config --system --add safe.directory '*'

      # Container only: the SDK image has no xz, which the linux-x64 FFmpeg
      # .tar.xz needs.
      - name: Install packages (container)
        if: matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends xz-utils

      # Hosted only. The self-hosted Windows box has .NET 8/10 installed on the
      # host, and the SDK container ships .NET 10.
      - uses: actions/setup-dotnet@v5
        if: matrix.hosted
        with:
          dotnet-version: '10.0.x'

      # The same reclaim publish.yml does, for the same reason. A full-solution
      # Release build tips ubuntu-latest's stock ~14GB image over to "No space
      # left on device"; publish.yml hit it during pack at v0.5.2-alpha.1 and
      # build.yml hits it during Build.
      #
      # It is worth knowing how this presents, because it cost two dispatches to
      # identify. The runner process dies writing its own diagnostic log, so the
      # job reports failure with *no step conclusion*, uploads *no logs at all*,
      # and `gh run view --log` has nothing for the leg. The cause appears only
      # in the check-run annotation.
      #
      # Hosted Linux only: these are the hosted Ubuntu image's preinstalled
      # toolchains, none of which a .NET build uses. `|| true` so a missing dir is
      # never fatal. The self-hosted leg builds on a large docker disk and, in a
      # container, cannot sudo the host anyway.
      - name: Free disk space (hosted Linux only)
        if: matrix.hosted && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup             /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Restore
        run: dotnet restore FrameFlow.slnx

      # publish.yml's test job has always had this; build.yml never did, and it
      # went unnoticed because build.yml died at Restore long before reaching a
      # test. With the auth step above it gets far enough to run the suite, and
      # BootstrapDiagnosticTests then fails outright — FfmpegBootstrap_Should
      # BeSuccessful and FfmpegLibraryDirectory_ShouldBeDetectable are plain
      # [Fact]s that assert the binaries are on disk, so on a runner with no
      # FFmpeg they are failures rather than skips. That is the correct shape
      # for them: they exist to catch a broken bootstrap, so making them skip
      # would delete the check.
      #
      # Host RID only. The runtime package's all-RID fetch belongs to
      # publish.yml; the tests look under <repo>/runtimes/{rid}/native for the
      # runner's own RID.
      # macOS needed `brew install ffmpeg@7` here until 2026-09, because
      # fetch-ffmpeg.cs read macOS libraries out of an installed keg and nothing
      # installed one, so the leg never got past the next step. It downloads a
      # pinned, hashed artifact now like every other RID, so the step is gone and
      # a green macOS leg tests the same bytes the package ships.
      #
      # macos-latest is Apple silicon, which is the only macOS architecture
      # FrameFlow supports. An Intel runner would fail the fetch: the RID was
      # removed in 2026-09.
      - name: Fetch FFmpeg binaries (host platform)
        run: dotnet run scripts/fetch-ffmpeg.cs

      # Every test that opens a media file skips without the corpus, so every leg
      # generates it: the Release legs for the corpus tests in each project, the
      # Debug leg because the use counters' own tests open a file (#737).
      # --allow-unavailable because the pinned FFmpeg is an LGPL build with no
      # libx264, which two fixtures need; the tests that use them skip.
      #
      # Not on macOS, which only a dispatch reaches. The osx-arm64 pin carries the
      # libraries and no ffmpeg tool, and no Homebrew ffmpeg has every encoder the
      # fixtures name (see ffmpeg-macos.yml), so the corpus tests skip there as
      # they always have.
      - name: Generate test corpus
        if: runner.os != 'macOS'
        run: dotnet run scripts/generate-test-corpus.cs -- --allow-unavailable

      # The Debug leg builds the whole solution too, so code that compiles only
      # under DEBUG is compiled somewhere in CI.
      - name: Build
        # FrameFlowLocalFeedDisable suppresses the on-build local-feed write
        # (the runner shouldn't scribble into ~/.nuget/local-feed).
        run: dotnet build FrameFlow.slnx --configuration ${{ matrix.configuration }} --no-restore -p:FrameFlowLocalFeedDisable=true

      # The default shell, as in publish.yml: bash on Linux and macOS, PowerShell 7 on
      # Windows, hosted and self-hosted.
      # --blame-hang-timeout fails a test that hangs, rather than letting it hold a
      # shared self-hosted runner until the job's timeout.
      - name: Test
        if: matrix.configuration == 'Release'
        run: dotnet test FrameFlow.slnx --configuration Release --no-build --blame-hang-timeout 5m --blame-crash --logger "trx;LogFileName=test-${{ matrix.os }}.trx"

      # The corpus tests skip without FFmpeg or the corpus, so a leg that lost
      # either would stay green having run none of them. This fails it unless a
      # corpus test class passed in full in each project that holds most of them.
      # They need only the corpus and FFmpeg, no GPU or audio device, so they run
      # on every leg that generates the corpus.
      #
      # PowerShell, because it reads the TRX on all three hosts: the SDK
      # container ships it, and the self-hosted Windows box need not have bash.
      - name: Check the corpus tests ran
        if: matrix.configuration == 'Release' && runner.os != 'macOS'
        shell: pwsh
        run: |
          $failed = $false
          $checks = @(
            @{ Project = 'Decoding'; Class = 'DemuxSessionIntegrationTests'; Count = 24 },
            @{ Project = 'Player'; Class = 'MediaPassIntegrationTests'; Count = 14 },
            @{ Project = 'Integration'; Class = 'VideoFormatAnnouncementTests'; Count = 3 }
          )
          foreach ($check in $checks) {
            $trx = "tests/FrameFlow.$($check.Project).Tests/TestResults/test-${{ matrix.os }}.trx"
            $prefix = "FrameFlow.$($check.Project).Tests.$($check.Class)."
            $passed = 0
            if (Test-Path $trx) {
              $passed = @(([xml](Get-Content -Raw $trx)).TestRun.Results.UnitTestResult |
                Where-Object { $_.testName.StartsWith($prefix) -and $_.outcome -eq 'Passed' }).Count
            }
            if ($passed -lt $check.Count) {
              "::error::$($check.Class) passed $passed of its $($check.Count) tests: the corpus tests did not run."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # The Debug leg's reason to exist (#726). DemuxSession, AudioDecoder and
      # DecodingPipeline take no lock around their native calls; their owner
      # ends every use before it disposes them, and in a Debug build a use
      # counter makes a dispose with a use still in flight throw instead of free
      # (ADR-0086, decision 3.5; src/FrameFlow.Decoding/Internal/UseCounter.cs).
      # Release compiles the counter away, and its tests with it, so on the legs
      # above a regression that frees one of them under a pump, a decode or a
      # seek passes. Decoding tests the resources themselves, Playback holds the
      # session that owns them, and Player runs that session over real media.
      # Media holds the other Debug-only tests: CpuVideoFrame and PcmAudioBuffer
      # fill storage they have returned to their pool, so a view kept past the
      # release reads the fill.
      #
      # The counters' own tests need FFmpeg and the corpus, and skip without
      # either, which would leave this leg green having checked nothing. The
      # last lines fail the leg unless they passed.
      #
      # Every project runs even when an earlier one fails, so one failure does
      # not hide the others' results or that check. The blame flags are the
      # Release Test step's.
      - name: Test (Debug)
        if: matrix.configuration == 'Debug'
        shell: bash
        run: |
          failed=0
          for project in Decoding Playback Player Media; do
            dotnet test "tests/FrameFlow.$project.Tests" --configuration Debug --no-build \
              --blame-hang-timeout 5m --blame-crash \
              --results-directory TestResults --logger "trx;LogFileName=test-debug-$project.trx" || failed=1
          done
          passed=$(grep -cE 'testName="FrameFlow\.Decoding\.Tests\.PassiveResourceUseTests\.[^"]*"[^>]*outcome="Passed"' TestResults/test-debug-Decoding.trx) || true
          if [ "${passed:-0}" -lt 3 ]; then
            echo "::error::PassiveResourceUseTests passed ${passed:-0} of its 3 tests: the use counters went unchecked."
            failed=1
          fi
          exit "$failed"

      # The tests reach the inference packages through project references, which
      # copy files a package consumer never gets. This packs them and runs an app
      # built against each .nupkg: a CPU session on every OS (#437), and on
      # Windows the package's own DirectML.dll beside onnxruntime.dll in an app
      # built without a runtime identifier (#433), and OpenVINO's plugins and TBB
      # beside Intel's onnxruntime.dll, running on OpenVINO's CPU device (#523).
      # See scripts/package-smoke.cs. This and the Avalonia 12 steps are about
      # what ships, which is Release, so the Debug leg skips them.
      - name: Package smoke test
        if: matrix.configuration == 'Release'
        run: dotnet run scripts/package-smoke.cs -- --no-build

      # The Avalonia packages compile against Avalonia 11, and an app on 12 runs that DLL on
      # 12. This runs it the same way: an app on Avalonia 12 references the Avalonia projects
      # as they ship and binds every type and member reference in FrameFlow.Avalonia and
      # FrameFlow.Avalonia.Windows against 12, so a reference 12 removed or reshaped fails
      # here, naming the member. Before the next step, which rebuilds those projects against
      # 12. See scripts/avalonia-binary-check.cs.
      - name: Avalonia 12 binary check
        if: matrix.configuration == 'Release'
        run: dotnet run scripts/avalonia-binary-check.cs -c Release -p:FrameFlowLocalFeedDisable=true

      # These build the Avalonia projects and their tests against 12 and run the tests, so a
      # source break on 12 fails here, and the tests run on 12's controls and Fluent theme.
      # Last in the job, because they rebuild those projects with other packages.
      #
      # One command per step, so no step depends on its shell stopping at a failed command:
      # PowerShell does not, and the step reports only the last command's exit code.
      - name: Avalonia 12 (FrameFlow.Avalonia.Tests)
        if: matrix.configuration == 'Release'
        run: dotnet test tests/FrameFlow.Avalonia.Tests --configuration Release -p:FrameFlowLocalFeedDisable=true "-p:FrameFlowAvaloniaVersion=12.*"

      - name: Avalonia 12 (FrameFlow.Avalonia.Windows.Tests)
        if: matrix.configuration == 'Release'
        run: dotnet test tests/FrameFlow.Avalonia.Windows.Tests --configuration Release -p:FrameFlowLocalFeedDisable=true "-p:FrameFlowAvaloniaVersion=12.*"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}${{ matrix.configuration == 'Debug' && '-debug' || '' }}
          path: "**/test-*.trx"
          retention-days: 14
